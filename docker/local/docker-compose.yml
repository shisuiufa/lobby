name: lobby

services:
  postgres:
    image: postgres:17-alpine
    container_name: postgres
    environment:
      POSTGRES_USER: lobby
      POSTGRES_PASSWORD: lobby
      POSTGRES_DB: lobby
      TZ: UTC
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}" ]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
  
  api:
    build:
      context: ../../api
      dockerfile: ../docker/local/api/Dockerfile
    container_name: api
    volumes:
      - ../../api:/app
      - api-node-modules:/app/node_modules
    environment:
      TZ: UTC
    env_file:
      - ../../api/.env
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: ../../web
      dockerfile: ../docker/local/web/Dockerfile
    container_name: web
    volumes:
      - ../../web:/app
      - web-node-modules:/app/node_modules
    environment:
      TZ: UTC

  nginx:
    image: nginx:alpine
    container_name: nginx
    ports:
      - "8080:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
      - web

volumes:
  api-node-modules:
  web-node-modules:
  postgres-data: